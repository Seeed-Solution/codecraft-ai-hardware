name: CodeCraft CLI release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Seeed-Solution/codecraft-ai-hardware'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate stable version and main ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "codecraft") | .version')
          test "$RELEASE_TAG" = "v$version"
          git merge-base --is-ancestor HEAD origin/main

  binaries:
    needs: prepare
    uses: ./.github/workflows/cli.yml

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: codecraft-*
          path: artifacts
      - name: Assemble installer assets and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in x86_64-unknown-linux-musl aarch64-apple-darwin x86_64-pc-windows-msvc; do
            suffix=''
            if [[ "$target" == *windows* ]]; then suffix='.exe'; fi
            test -s "artifacts/codecraft-$target/codecraft$suffix"
            cp "artifacts/codecraft-$target/codecraft$suffix" "dist/codecraft-$target$suffix"
          done
          chmod +x dist/codecraft-x86_64-unknown-linux-musl
          test "$(dist/codecraft-x86_64-unknown-linux-musl --version)" = "codecraft ${RELEASE_TAG#v}"
          cd dist
          sha256sum codecraft-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "CodeCraft $RELEASE_TAG"
