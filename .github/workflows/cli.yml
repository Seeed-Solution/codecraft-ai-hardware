name: CodeCraft CLI binaries

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'tools/cli/**'
      - 'platforms/**/*.rs'
      - 'tests/tools/cli/**'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ''
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Restore compiled CLI and host tests
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .codecraft/cargo
            .codecraft/rust-test-binaries.txt
          key: cli-v1-${{ runner.os }}-${{ matrix.target }}-rust-1.89.0-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'tools/cli/Cargo.toml', 'tools/cli/src/**', 'platforms/**/*.rs', 'tests/tools/cli/**/*.rs', '.github/workflows/cli.yml') }}
      - name: Install pinned compiler
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup target add --toolchain 1.89.0 "${{ matrix.target }}"
      - name: Install Linux linker
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Compile CLI and test executables only on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo +1.89.0 build --locked --release --package codecraft --target '${{ matrix.target }}'
          cargo +1.89.0 test --locked --release --package codecraft --target '${{ matrix.target }}' --no-run --message-format=json > .codecraft/test-artifacts.jsonl
          .codecraft/cargo/${{ matrix.target }}/release/codecraft${{ matrix.suffix }} maintenance ci test-binaries \
            --input .codecraft/test-artifacts.jsonl --output .codecraft/rust-test-binaries.txt
      - name: Install Python test runtime for independent host fixtures
        run: python -m pip install pytest==8.3.5
      - name: Run cached tests against current repository data
        shell: bash
        env:
          CODECRAFT_TEST_PYTHON: python
        run: |
          while IFS= read -r executable; do "$executable"; done < .codecraft/rust-test-binaries.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codecraft-${{ matrix.target }}
          path: .codecraft/cargo/${{ matrix.target }}/release/codecraft${{ matrix.suffix }}
          if-no-files-found: error
